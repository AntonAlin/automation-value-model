name: Kör notebook

# Enda testet som betyder något här: går notebooken att köra rakt igenom,
# på en ren maskin, utan att krascha?
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nbconvert ipykernel

      - name: Kör notebooken
        run: |
          jupyter nbconvert --to notebook --execute \
            --output /tmp/executed.ipynb projektautomatisering.ipynb
